<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>外卖定价器 Pro v3.6 · 海饺鲜生专属（美团/淘宝闪购/京东外卖·神券测算）</title>
<style>
  :root{
    --teal:#12B886; --teal-d:#0CA678; --teal-l:#E6F7F1; --teal-xl:#F2FBF8;
    --ink:#21302B; --sub:#6B7C77; --line:#ECF1EF; --bg:#F5F7F6;
    --red:#E8503A; --amber:#E08A1E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:#E9EDEB; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center; padding:24px 12px; gap:28px; flex-wrap:wrap;
  }
  .stage{display:flex; gap:28px; flex-wrap:wrap; justify-content:center; align-items:flex-start;}
  .side{width:260px; color:#5a6a64; font-size:13px; line-height:1.7;}
  .side h3{color:var(--teal-d); font-size:15px; margin:0 0 8px;}
  .side ul{padding-left:18px; margin:6px 0;}
  .side code{background:#fff; border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--teal-d);}
  /* phone frame */
  .phone{
    width:390px; height:844px; background:#fff; border-radius:46px;
    box-shadow:0 18px 60px rgba(20,60,50,.22), inset 0 0 0 11px #11100f;
    position:relative; overflow:hidden; display:flex; flex-direction:column;
  }
  .notch{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:148px; height:26px; background:#11100f; border-radius:0 0 16px 16px; z-index:30;}
  .statusbar{height:50px; flex:0 0 50px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 28px 0; font-size:14px; font-weight:600; z-index:20;}
  .statusbar .sb-right{display:flex; gap:6px; align-items:center;}
  .navbar{flex:0 0 46px; background:var(--teal); color:#fff; display:flex; align-items:center; padding:0 12px; z-index:10; position:relative;}
  .navbar .back{width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; visibility:hidden;}
  .navbar .back.show{visibility:visible;}
  .navbar .title{flex:1; text-align:center; font-size:17px; font-weight:600; padding-right:32px;}
  .content{flex:1; overflow-y:auto; background:var(--bg); padding-bottom:8px; -webkit-overflow-scrolling:touch;}
  .content::-webkit-scrollbar{width:0;}
  .tabbar{flex:0 0 64px; background:#fff; border-top:1px solid var(--line); display:flex;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--sub); cursor:pointer; font-size:11px;}
  .tab.active{color:var(--teal);}
  .tab svg{width:25px; height:25px;}

  /* design system */
  .page-wrap{padding:14px 14px 18px;}
  .hero-card{background:linear-gradient(135deg,var(--teal),var(--teal-d)); border-radius:16px; padding:18px 18px 16px; color:#fff; box-shadow:0 8px 22px rgba(18,184,134,.28);}
  .hc-title{font-size:21px; font-weight:800; letter-spacing:.5px;}
  .hc-sub{font-size:12.5px; opacity:.92; margin-top:5px;}
  .hc-chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px;}
  .chip{background:rgba(255,255,255,.20); border:1px solid rgba(255,255,255,.35); color:#fff; font-size:12px; padding:4px 11px; border-radius:20px;}
  .info-card{background:#fff; border-radius:13px; margin-top:12px; padding:4px 14px; box-shadow:0 2px 10px rgba(40,80,70,.05);}
  .info-head{display:flex; justify-content:space-between; align-items:center; padding:13px 0; cursor:pointer; font-size:14.5px; font-weight:600; color:var(--ink);}
  .info-head .ih-a{color:var(--sub); font-size:13px; font-weight:500;}
  .info-body{padding:2px 0 14px;}
  .qa{padding:7px 0; border-top:1px dashed var(--line);}
  .qa:first-child{border-top:none;}
  .q{font-size:13.5px; font-weight:600; color:var(--teal-d); margin-bottom:3px;}
  .a{font-size:13px; color:#56635e; line-height:1.6;}
  .promo-card{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid #D7F0E6; border-left:4px solid var(--teal); border-radius:13px; margin-top:12px; padding:13px 14px; cursor:pointer;}
  .pc-ico{font-size:26px;}
  .pc-name{font-size:15px; font-weight:700; color:var(--ink);}
  .pc-desc{font-size:12px; color:var(--sub); margin-top:3px; line-height:1.5;}
  .pc-tag{background:var(--teal); color:#fff; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:12px;}
  .g-card{position:relative; background:#fff; border-radius:13px; padding:14px 13px 13px; box-shadow:0 2px 10px rgba(40,80,70,.05); cursor:pointer; border:1px solid var(--line);}
  .gc-tag{position:absolute; top:0; right:0; background:var(--teal-l); color:var(--teal-d); font-size:10.5px; padding:3px 8px; border-radius:0 13px 0 13px; font-weight:600;}
  .gc-tag.adv{background:#FFF1DE; color:#C9780F;}
  .gc-ico{font-size:23px;}
  .gc-name{font-size:14px; font-weight:700; margin-top:7px; color:var(--ink); line-height:1.35;}
  .gc-desc{font-size:11.5px; color:var(--sub); margin-top:5px; line-height:1.55; min-height:34px;}
  .disclaimer{font-size:11px; color:#9AA8A4; text-align:center; margin-top:14px;}

  .formula-card{background:var(--teal-xl); border:1px solid #CDEFE2; border-radius:13px; padding:13px 14px; margin-top:12px;}
  .fc-t{font-size:14px; font-weight:700; color:var(--teal-d); margin-bottom:7px;}
  .fc-c{font-size:12.5px; color:#3f524b; line-height:1.7;}
  .blk-title{font-size:13px; font-weight:700; color:var(--ink); margin:16px 2px 8px; display:flex; align-items:center; gap:7px;}
  .blk-title::before{content:""; width:4px; height:13px; background:var(--teal); border-radius:3px; display:inline-block;}
  .row-group{background:#fff; border-radius:13px; padding:2px 14px; box-shadow:0 2px 10px rgba(40,80,70,.05);}
  .field-row{display:flex; align-items:center; padding:13px 0; border-bottom:1px solid var(--line); gap:10px;}
  .field-row:last-child{border-bottom:none;}
  .fr-label{flex:1; font-size:14px; color:#33403b;}
  .fr-input{flex:0 0 92px; text-align:right; font-size:15px; color:var(--ink); border:none; outline:none; background:var(--teal-xl); border-radius:8px; padding:7px 10px; font-weight:600;}
  .fr-unit{flex:0 0 auto; font-size:13px; color:var(--sub); width:54px; text-align:right;}
  .fr-static{flex:1; text-align:right; font-size:14px; color:var(--ink); font-weight:600;}
  .picker-row{display:block;}
  .opt-group{display:flex; gap:10px; margin:4px 0;}
  .opt{flex:1; text-align:center; padding:11px 0; border:1.5px solid var(--line); border-radius:11px; font-size:14px; color:var(--sub); font-weight:600; cursor:pointer; background:#fff;}
  .opt.active{background:var(--teal-l); border-color:var(--teal); color:var(--teal-d);}
  .result-card{background:#fff; border-radius:15px; padding:17px 16px; margin-top:6px; box-shadow:0 4px 16px rgba(40,80,70,.07);}
  .rc-label{font-size:13px; color:var(--sub);}
  .result-hero{font-size:38px; font-weight:800; color:var(--teal-d); margin:4px 0 12px; line-height:1;}
  .result-sub{font-size:12.5px; color:var(--sub); margin:-6px 0 12px;}
  .result-line{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:14px;}
  .result-line .rl-k{color:#56635e;}
  .result-line .rl-v{font-weight:700; color:var(--ink);}
  .result-line.strong{border-top:2px solid var(--teal-l); margin-top:2px;}
  .result-line.strong .rl-v{color:var(--teal-d); font-size:16px;}
  .rl-v.plus{color:var(--teal-d);} .rl-v.minus{color:var(--red);}
  .mini-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:12px;}
  .mini-card{background:#fff; border-radius:13px; padding:13px; text-align:center; box-shadow:0 2px 10px rgba(40,80,70,.05);}
  .mc-l{font-size:12.5px; color:var(--sub);}
  .mc-v{font-size:21px; font-weight:800; color:var(--ink); margin-top:5px;}
  .mc-v.green{color:var(--teal-d);} .mc-v.red{color:var(--red);}
  .mc-sub{font-size:12px; color:var(--sub); margin-top:3px;}
  .notice{display:flex; gap:8px; align-items:flex-start; background:#FFF8EC; border:1px solid #FBE6C0; color:#8a6418; font-size:12.5px; line-height:1.6; padding:11px 13px; border-radius:11px; margin-top:12px;}
  .notice.green{background:#EAFaf3; border-color:#CDEFE2; color:#0e7a55;}
  .notice.warn{background:#FFF8EC; border-color:#FBE6C0; color:#8a6418;}
  .footer-btns{display:flex; gap:10px; margin-top:16px;}
  .fb{flex:1; border:none; border-radius:12px; padding:13px 0; font-size:15px; font-weight:700; cursor:pointer;}
  .fb-share{background:var(--teal-l); color:var(--teal-d);}
  .fb-clear{background:#fff; color:var(--sub); border:1px solid var(--line);}
  .fb-save{background:var(--teal); color:#fff;}
  .tbl{background:#fff; border-radius:13px; overflow:hidden; margin-top:6px; box-shadow:0 2px 10px rgba(40,80,70,.05);}
  .tbl-head{display:flex; background:var(--teal-xl); font-size:12.5px; font-weight:700; color:var(--teal-d);}
  .tbl-row{display:flex; border-top:1px solid var(--line); font-size:13px;}
  .tc{flex:1; padding:11px 8px; text-align:center; color:#3f524b;}
  .tc.hl{color:var(--teal-d); font-weight:700;}
  .tc.good{color:var(--teal-d); font-weight:700;}
  .tc.bad{color:var(--red); font-weight:700;}
  .tc:nth-child(2),.tc:nth-child(3),.tc:nth-child(4){flex:1;}

  .chips-wrap{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .time-opt{background:#fff; border:1px solid var(--line); color:var(--sub); font-size:12.5px; padding:8px 11px; border-radius:20px; cursor:pointer; font-weight:600;}
  .time-opt.active{background:var(--teal-l); border-color:var(--teal); color:var(--teal-d);}
  input[type=range]{width:100%; accent-color:var(--teal); margin-top:8px;}
  .slider-row{display:flex; align-items:center; gap:12px;}
  .slider-row input[type=range]{flex:1;}

  .cp-block{margin-top:12px;}
  .cp-head{font-size:12.5px; color:var(--sub); margin-bottom:6px;}
  .cp-row{display:flex; gap:9px;}
  .cp-input{flex:1; background:var(--teal-xl); border:none; border-radius:9px; padding:10px 11px; font-size:14px; outline:none; font-weight:600; text-align:center;}
  .add-cp{margin-top:12px; text-align:center; color:var(--teal-d); font-size:13.5px; font-weight:600; background:var(--teal-xl); border:1px dashed var(--teal); border-radius:10px; padding:10px; cursor:pointer;}

  .card2{background:#fff; border-radius:13px; padding:14px; box-shadow:0 2px 10px rgba(40,80,70,.05);}
  .cost-grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .cost-item{background:var(--teal-xl); border-radius:10px; padding:11px;}
  .ci-l{font-size:12.5px; color:var(--sub);}
  .ci-i{width:100%; border:none; background:transparent; outline:none; font-size:19px; font-weight:800; color:var(--teal-d); padding:4px 0 0; text-align:left;}
  .daily-fixed{display:flex; justify-content:space-between; align-items:center; margin-top:13px; padding-top:12px; border-top:1px solid var(--line); font-size:13.5px; color:var(--sub);}
  .df-v{font-size:16px; font-weight:800; color:var(--teal-d);}

  .bom-head{display:flex; font-size:11.5px; color:var(--sub); padding:10px 2px 7px;}
  .bh-name{flex:1.6;} .bh-num{flex:1; text-align:center;} .bh-cost{flex:1; text-align:center;}
  .bom-row{display:flex; align-items:center; gap:6px; padding:5px 0; border-top:1px solid var(--line);}
  .bom-name{flex:1.6; background:var(--teal-xl); border:none; border-radius:8px; padding:8px 9px; font-size:13px; outline:none;}
  .bom-num{flex:1; background:var(--teal-xl); border:none; border-radius:8px; padding:8px 0; font-size:13px; outline:none; text-align:center; width:0;}
  .bom-cost{flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--teal-d);}
  .bom-del{flex:0 0 22px; text-align:center; color:#C9D2CE; cursor:pointer; font-size:14px;}

  .band{margin:12px 2px 0;}
  .band-track{height:7px; background:#E2EAE7; border-radius:6px; position:relative;}
  .band-you{position:absolute; top:50%; width:15px; height:15px; background:var(--teal); border:2px solid #fff; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .band-you-label{font-size:12px; color:var(--teal-d); margin-top:8px; font-weight:700;}

  /* history / mine */
  .record{background:#fff; border-radius:13px; padding:13px 14px; margin-top:12px; box-shadow:0 2px 10px rgba(40,80,70,.05);}
  .rec-top{display:flex; justify-content:space-between; font-size:13.5px;}
  .rec-tool{font-weight:700; color:var(--ink);}
  .rec-time{color:var(--sub); font-size:12px;}
  .rec-out{font-size:13px; color:var(--teal-d); margin-top:6px; font-weight:600;}
  .btn-clear{width:100%; margin-top:16px; background:#fff; border:1px solid var(--line); color:var(--red); border-radius:12px; padding:13px; font-size:14.5px; font-weight:700; cursor:pointer;}
  .empty{text-align:center; color:#9AA8A4; padding:70px 0; font-size:14px; line-height:2;}
  .empty-ico{font-size:46px; display:block; margin-bottom:10px;}
  .hero{background:linear-gradient(135deg,var(--teal),var(--teal-d)); border-radius:16px; padding:22px 18px; color:#fff; text-align:center;}
  .hero-title{font-size:20px; font-weight:800;}
  .hero-sub{font-size:12.5px; opacity:.9; margin-top:6px;}
  .section-title{font-size:15px; font-weight:800; color:var(--ink); margin:18px 2px 12px;}
  .section-title .t{position:relative; padding-left:11px;}
  .section-title .t::before{content:""; position:absolute; left:0; top:2px; width:4px; height:15px; background:var(--teal); border-radius:3px;}
  .tip{display:flex; gap:8px; background:#fff; border-radius:12px; padding:13px; font-size:12.5px; color:#56635e; line-height:1.65; margin-top:12px;}
  .card{background:#fff; border-radius:13px; padding:14px; margin-top:11px; box-shadow:0 2px 10px rgba(40,80,70,.05);}
  .tip-title{font-size:14px; font-weight:700; color:var(--teal-d);}
  .tip-desc{font-size:12.5px; color:#56635e; margin-top:5px; line-height:1.6;}

  .toast{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(20,30,26,.86); color:#fff; font-size:13.5px; padding:11px 18px; border-radius:10px; z-index:50; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar">

      <span class="sb-right">
        <svg width="17" height="13" viewBox="0 0 17 13"><rect x="0" y="8" width="3" height="5" rx="1" fill="#fff"/><rect x="4.5" y="5" width="3" height="8" rx="1" fill="#fff"/><rect x="9" y="2.5" width="3" height="10.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="13" rx="1" fill="#fff"/></svg>

  <div class="side">
    <h3>静态预览说明</h3>
    <p>这是「配送定价助手」复刻版的<strong>浏览器预览</strong>，单文件即可双击打开，无需微信开发者工具。</p>
    <ul>
      <li>底部 3 个 Tab 切换 <code>工具箱 / 历史 / 我的</code></li>

</div>

<script>
/* ---------- icons ---------- */
const ICONS = {
  toolbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><line x1="12" y1="8" x2="12" y2="13"/><rect x="10.4" y="11" width="3.2" height="3" rx="0.8"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.4"/><line x1="12" y1="12" x2="12" y2="6.5"/><line x1="12" y1="12" x2="15.5" y2="14"/></svg>',

  {page:'index', text:'工具箱', icon:'toolbox'},

];

/* 阶梯神券（按商品原价分档，平台 1:1 补贴，新客再 +1）—— 海饺鲜生美团实测规则 */
function shenquanByOriginal(orig){
  if(orig<20) return 6; if(orig<28) return 7; if(orig<38) return 9; if(orig<48) return 11;
  if(orig<58) return 12; if(orig<68) return 14; if(orig<88) return 15; if(orig<128) return 18;

  actualPrice:{ f:{target:'20',pack:'1',shipFee:'2.5',rate:'7.6',minFee:'1.06'}, pIndex:0, mIndex:0, tIndex:0, distance:3,
    platforms:['美团外卖','淘宝闪购','京东外卖'],
    platformRates:[7.6,5,6], platformMinFee:[1.06,1,0], platformShip:[2.5,3,3],
    sq:{on:true,auto:true,manual:'0',newCust:'1'} },

  breakeven:{ f:{rent:'5000',mgmt:'400',labor:'9000',utility:'1500',avgCost:'7',avgPrice:'30'} },

    {tool:'外卖满减计算器', time:'09-29 10:50', output:'建议定价 ¥18.00'},
    {tool:'外卖到手价计算器', time:'09-29 10:42', output:'推荐标价 ¥23.65'}
  ]},
  mine:{}, compare:{ f:{ amount:'30', cut:'5', ship:'3' }, sq:{on:true,auto:true,manual:'0'} }

        <div class="result-line"><text class="rl-k">平台佣金</text><text class="rl-v minus">-¥${fee.toFixed(2)}</text></div>
        <div class="result-line"><text class="rl-k">配送服务费</text><text class="rl-v minus">-¥${shipFee.toFixed(2)}</text></div>
        <div class="result-line"><text class="rl-k">神券商家承担</text><text class="rl-v minus">-¥${sqMer.toFixed(0)}</text></div>
        <div class="result-line"><text class="rl-k">新客券（商家）</text><text class="rl-v minus">-¥${newCust.toFixed(0)}</text></div>
        <div class="result-line strong"><text class="rl-k">用户到手</text><text class="rl-v">¥${real.toFixed(2)}</text></div>
      </div>`;
  },

  newProduct(){
    const f=S.newProduct.f, cost=num(f.cost), margin=num(f.margin), sens=num(f.sens)||0;
    if([cost,margin].some(isNaN)||margin>=100){ $('outNew').innerHTML=`<div class="result-card"><div class="rc-label">建议定价</div><div class="result-hero">0.00</div></div>`; return; }
    const price=cost/(1-margin/100), profit=price-cost, up=price+sens, down=price-sens;
    const upRate=(up-cost)/up*100, downRate=(down-cost)/down*100;
    const cps=S.newProduct.competitors.map(c=>num(c.price)).filter(n=>!isNaN(n));
    let bandMin=0,bandMax=0,youPos=50,bandTip='';
    if(cps.length){
      bandMin=Math.min.apply(null,cps); bandMax=Math.max.apply(null,cps);
      const span=bandMax-bandMin; youPos=span>0?Math.max(4,Math.min(96,(price-bandMin)/span*100)):50;
      if(price>bandMax) bandTip='比最贵的竞对还高 ¥'+(price-bandMax).toFixed(2)+' 元，需突出差异化价值';
      else if(price<bandMin) bandTip='比最低的竞对还低 ¥'+(bandMin-price).toFixed(2)+' 元，有明显价格优势';
      else bandTip='处于竞对价格带内，性价比适中';
    }
    $('outNew').innerHTML=`
      <div class="result-card"><div class="rc-label">建议定价</div><div class="result-hero">${price.toFixed(2)}</div>
        <div class="result-sub">毛利额 ¥${profit.toFixed(2)}（${margin.toFixed(0)}%）</div>
        <div class="result-line"><text class="rl-k">竞对价格带</text><text class="rl-v">最低 ¥${bandMin.toFixed(0)} · 最高 ¥${bandMax.toFixed(0)}</text></div>
        <div class="band"><div class="band-track"><div class="band-you" style="left:${youPos}%"></div></div><div class="band-you-label">你 ¥${price.toFixed(2)}</div></div>
      </div>
      ${bandTip?`<div class="notice warn"><text>💡</text><text>${bandTip}</text></div>`:''}
      <div class="blk-title">价格敏感度（±${f.sens}元）</div>
      <div class="mini-grid">
        <div class="mini-card"><div class="mc-l">涨价 ${f.sens} 元</div><div class="mc-v green">¥${up.toFixed(2)}</div><div class="mc-sub">毛利率 ${upRate.toFixed(1)}%</div></div>
        <div class="mini-card"><div class="mc-l">降价 ${f.sens} 元</div><div class="mc-v red">¥${down.toFixed(2)}</div><div class="mc-sub">毛利率 ${downRate.toFixed(0)}%</div></div>
      </div>
      ${footerBtns([{t:'分享',c:'share',a:'share'},{t:'清空',c:'clear',a:'clear'},{t:'保存',c:'save',a:'save'}])}`;
  },

  breakeven(){
    const f=S.breakeven.f, rent=num(f.rent)||0, mgmt=num(f.mgmt)||0, labor=num(f.labor)||0, utility=num(f.utility)||0;
    const avgCost=num(f.avgCost), avgPrice=num(f.avgPrice), total=rent+mgmt+labor+utility, dailyFixed=total/30;
    $('beDaily').textContent='¥'+dailyFixed.toFixed(0)+'/天';
    if([avgCost,avgPrice].some(isNaN)||avgPrice<=0){ $('beCostRate').textContent='0%'; $('beMargin').textContent='0%'; $('outBreak').innerHTML=''; return; }
    const costRate=avgCost/avgPrice*100, marginRate=(avgPrice-avgCost)/avgPrice*100;
    const breakeven=marginRate>0?dailyFixed/(marginRate/100):0, mBreakeven=breakeven*30;
    $('beCostRate').textContent=costRate.toFixed(1)+'%'; $('beMargin').textContent=marginRate.toFixed(1)+'%';
    const mk=(name,ratio)=>{ const day=breakeven*ratio, dp=day*(marginRate/100)-dailyFixed; return {name,day:day.toFixed(2),dayProfit:(dp>=0?'':'-')+'¥'+Math.abs(dp).toFixed(0),monthProfit:(dp>=0?'':'-')+'¥'+Math.abs(dp*30).toFixed(0),cls:dp<0?'bad':(dp>0?'good':'hl')}; };
    const tiers=[mk('亏损区',0.8),mk('平衡点',1),mk('盈利区',1.2)]; tiers[1].dayProfit='¥0'; tiers[1].monthProfit='¥0';
    const rows=tiers.map(t=>`<div class="tbl-row"><div class="tc ${t.cls}">${t.name}</div><div class="tc">¥${t.day}</div><div class="tc ${t.cls}">${t.dayProfit}</div><div class="tc ${t.cls}">${t.monthProfit}</div></div>`).join('');
    $('outBreak').innerHTML=`
      <div class="result-card"><div class="rc-label">单日盈亏平衡点</div><div class="result-hero">¥${breakeven.toFixed(1)}</div>
        <div class="result-sub">每天至少要卖这么多钱才不亏</div>
        <div class="result-line"><text class="rl-k">盈亏平衡营业额（月）</text><text class="rl-v">¥${mBreakeven.toFixed(0)}</text></div>
        <div class="result-line"><text class="rl-k">单日固定成本</text><text class="rl-v">¥${dailyFixed.toFixed(0)}</text></div>
      </div>
      <div class="blk-title">三档营业额对照</div>
      <div class="tbl"><div class="tbl-head"><div class="tc">档位</div><div class="tc">日营业额</div><div class="tc">日利润</div><div class="tc">月利润</div></div>${rows}</div>
      <div class="notice warn"><text>💡</text><text>公式：单日盈亏线 = 单日固定成本 ÷ 毛利率。毛利率越高，盈亏线越低，越容易盈利。</text></div>
      ${footerBtns([{t:'分享',c:'share',a:'share'},{t:'清空',c:'clear',a:'clear'},{t:'保存',c:'save',a:'save'}])}`;
  },

  cost(){
    const items=S.cost.items; let total=0;
    items.forEach(it=>{ total += (num(it.qty)||0)*(num(it.price)||0); });
    $('ctTotal').textContent='¥'+total.toFixed(2);
    const margin=num(S.cost.margin), price=(!isNaN(margin)&&margin<100&&total>0)?total/(1-margin/100):0;
    $('outCost').innerHTML=`
      <div class="result-card"><div class="rc-label">建议售价</div><div class="result-hero">${price.toFixed(2)}</div>
        <div class="result-sub">单份毛利 ¥${(price-total).toFixed(2)}</div>
        <div class="result-line"><text class="rl-k">单份成本</text><text class="rl-v">¥${total.toFixed(2)}</text></div>
      </div>`;
  }
};

/* ---------- mount / router ---------- */
let stack=['index'];
function mount(page){
  const isTab = TABS.some(t=>t.page===page);
  $('content').innerHTML = RENDER[page]();
  $('navTitle').textContent = TITLES[page];
  $('backBtn').classList.toggle('show', stack.length>1);
  // tabbar
  $('tabbar').innerHTML = TABS.map(t=>`<div class="tab ${t.page===page?'active':''}" data-act="tab" data-page="${t.page}">${ICONS[t.icon]}<span>${t.text}</span></div>`).join('');
  if(CALC[page]) CALC[page]();
}
function goto(page, isTab){
  if(isTab) stack=[page];
  else stack.push(page);
  mount(page);
}

/* ---------- events (delegation) ---------- */
$('content').addEventListener('input', e=>{
  const el=e.target; const g=el.dataset.group, k=el.dataset.k, i=el.dataset.i;
  if(!g) return;
  const page = stack[stack.length-1];
  if(g==='margin'){ S.cost.margin = el.value; if(page==='cost') CALC.cost(); return; }
  if(i!==undefined){
    if(g==='competitors') S[page].competitors[i][k]=el.value;
    else if(g==='items'){ S.cost.items[i][k]=el.value;
      if((k==='qty'||k==='price') && el.closest('.bom-row')){
        const it=S.cost.items[i];
        el.closest('.bom-row').querySelector('.bom-cost').textContent='¥'+((num(it.qty)||0)*(num(it.price)||0)).toFixed(2);
      }
    }
  } else {
    S[page][g][k]=el.value;
  }
  if(CALC[page]) CALC[page]();
});
$('content').addEventListener('change', e=>{
  const el=e.target; const g=el.dataset.group;
  if(g==='pIndex'||g==='bIndex'){
    const page=stack[stack.length-1]; S[page][g]=parseInt(el.value,10);
    // 切换平台时同步带出该平台真实扣点率与配送费（美团 7.6%+2.5 / 淘宝闪购 5%+3 / 京东外卖 6%+3）
    if(page==='commission' && g==='pIndex'){
      const i=S.commission.pIndex;
      S.commission.f.rate=String(S.commission.platformRates[i]);
      S.commission.f.ship=String(S.commission.platformShip[i]);
    }
    CALC[page]();
  }
});
$('content').addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, page=stack[stack.length-1];
  if(act==='go') goto(t.dataset.page,false);
  else if(act==='tab') goto(t.dataset.page,true);
  else if(act==='back'){ stack.pop(); mount(stack[stack.length-1]); }
  else if(act==='toggleInfo'){ const b=$('infoBody'); const open=b.style.display!=='none'; b.style.display=open?'none':'block'; $('infoA').textContent=open?'展开 ∨':'收起 ∧'; }
  else if(act==='toggleAdv'){ const b=$('advBody'); const open=b.style.display!=='none'; b.style.display=open?'none':'block'; $('advA').textContent=open?'展开 ∨':'收起 ∧'; }
  else if(act==='platform'){ if(page==='fullReduction'){ const i=+t.dataset.i; S.fullReduction.pIndex=i; S.fullReduction.f.rate=String([7.6,5,6][i]); } else if(page==='actualPrice'){ const i=+t.dataset.i; S.actualPrice.pIndex=i; S.actualPrice.f.rate=String([7.6,5,6][i]); S.actualPrice.f.minFee=String([1.06,1,0][i]); S.actualPrice.f.shipFee=String([2.5,3,3][i]); } CALC[page](); mount(page); }
  else if(act==='toggleSq'){ S[page].sq.on=!S[page].sq.on; mount(page); }
  else if(act==='toggleSqAuto'){ S[page].sq.auto=!S[page].sq.auto; mount(page); }
  else if(act==='mode'){ S.actualPrice.mIndex=+t.dataset.i; mount(page); }
  else if(act==='time'){ S.actualPrice.tIndex=+t.dataset.i; mount(page); }
  else if(act==='distance'){ /* handled in input range change below */ }
  else if(act==='addCp'){ const arr=S[page].competitors; if(arr.length<3){ arr.push(page==='newProduct'?{price:'',name:''}:{min:'',ship:''}); mount(page); } }
  else if(act==='delItem'){ S.cost.items.splice(+t.dataset.i,1); mount('cost'); }
  else if(act==='addItem'){ S.cost.items.push({name:'',qty:'',price:''}); mount('cost'); }
  else if(act==='clear'){ if(page==='history'){ S.history.list=[]; mount('history'); } else { clearPage(page); } }
  else if(act==='save'){ saveRecord(page); toast('已保存到历史'); }
  else if(act==='share'){ toast('分享功能需在微信中使用'); }
});
$('content').addEventListener('input', e=>{
  if(e.target.dataset.act==='distance'){ S.actualPrice.distance=parseFloat(e.target.value); $('apDist').textContent=S.actualPrice.distance+' km'; }
});

function clearPage(page){
  const defs={
    roi:{f:{access:'',conv:'',price:'',rep:'',cost:''}},
    commission:{f:{amount:'',rate:'',cut:'',ship:''},adv:{subsidy:'0'},sq:{on:true,auto:true,manual:'0',newCust:'1'}},
    delivery:{f:{avgPrice:'',cost:'',rate:'',cutRatio:'',shipSelf:''},competitors:[{min:'',ship:''}]},
    fullReduction:{f:{target:'',rate:'',cost:'',minPrice:''}},
    actualPrice:{f:{target:'',pack:'',shipFee:'',rate:'',minFee:''},sq:{on:true,auto:true,manual:'0',newCust:'1'}},
    newProduct:{f:{cost:'',margin:'',sens:''},competitors:[{price:'',name:''}]},
    breakeven:{f:{rent:'',mgmt:'',labor:'',utility:'',avgCost:'',avgPrice:''}},
    cost:{margin:'65',items:[]}
  };
  if(defs[page]){ Object.assign(S[page], JSON.parse(JSON.stringify(defs[page]))); if(page==='cost') S.cost.items=[{name:'',qty:'',price:''}]; }
  mount(page); toast('已清空');
}
function saveRecord(page){
  const out = $('content').querySelector('.result-hero');
  const label = TITLES[page]||'计算器';
  S.history.list.unshift({tool:label, time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'), output:(out?out.textContent:'—')});
  if(S.history.list.length>20) S.history.list.pop();
}

/* ---------- boot ---------- */
// 导航栏返回：backBtn 与 tabbar 都在 #content 之外，需用独立委托捕获
$('backBtn').addEventListener('click', ()=>{ if(stack.length>1){ stack.pop(); mount(stack[stack.length-1]); } });
$('tabbar').addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='tab') goto(t.dataset.page,true);
});
mount('index');
</script>
</body>
</html>
